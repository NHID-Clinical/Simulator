<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Safe Agent Deployment • Zero Latency</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/hyper-glass.css"><script src="assets/hyper-glass.js" defer></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');body{font-family:'Inter',system-ui,sans-serif}.font-display{font-family:'Space Grotesk','Inter',sans-serif}button:focus-visible,a:focus-visible{outline:3px solid rgb(20 184 166);outline-offset:4px}.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}</style>  <link rel="icon" href="assets/nhid-logo.svg" type="image/svg+xml">
</head><body class="hg-body text-white" onload="shell()"><main class="relative z-10 mx-auto max-w-5xl px-6 py-10"><nav class="mb-8 flex items-center justify-between text-sm"><a href="index.html" class="inline-flex items-center gap-2 text-white/70 hover:text-teal-300"><i class="fa-solid fa-arrow-left"></i> Simulator home</a><a href="zero-latency-dashboard.html" class="text-white/70 hover:text-teal-300">Dashboard</a></nav><div class="mb-6 grid gap-3 sm:grid-cols-2"><div class="rounded-3xl border border-teal-500/30 bg-teal-500/10 p-4"><div class="text-xs uppercase tracking-[2px] text-teal-300">Trust & Compliance</div><div class="font-display text-3xl" data-trust>100%</div></div><div class="rounded-3xl border border-rose-500/30 bg-rose-500/10 p-4"><div class="text-xs uppercase tracking-[2px] text-rose-300">Potential HIPAA Penalty</div><div class="font-display text-3xl" data-penalty>$0</div></div></div><section class="hyper-glass p-8"><div class="text-xs font-bold uppercase tracking-[3px] text-teal-400">Module 4 · Provider-Side Deployment</div><h1 class="font-display mt-3 text-5xl">Build the Safe Voice Agent</h1><p class="mt-3 text-white/70">Reorder the prompt nodes so disclosure fires before any data request or human-like artifact.</p><ol id="nodes" class="mt-8 space-y-3"></ol><button id="check" class="emissive mt-6 px-5 py-3">Validate sequence</button><div id="feedback" class="mt-6 hidden rounded-3xl border p-5"></div></section></main><script>
const GAME_KEY='zeroLatencyGameState', PROGRESS_KEY='zeroLatencyProgress';
function state(){try{return JSON.parse(localStorage.getItem(GAME_KEY)||'{"trust":100,"penalty":0,"modules":{},"streak":0}')||{trust:100,penalty:0,modules:{},streak:0}}catch{return {trust:100,penalty:0,modules:{},streak:0}}}
function save(s){localStorage.setItem(GAME_KEY,JSON.stringify(s));const p={};Object.entries(s.modules||{}).forEach(([id,m])=>p[id]={completed:true,score:m.score,completedAt:m.completedAt});localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));}
function award(id,score,penalty=0){const s=state();s.trust=Math.max(0,Math.min(100,Math.round((s.trust*.7)+(score*.3)-penalty/5000)));s.penalty+=(penalty||0);s.streak=score>=90?s.streak+1:0;s.modules[id]={score,penalty,completedAt:new Date().toISOString()};save(s);return s;}
function meter(){const s=state();document.querySelectorAll('[data-trust]').forEach(e=>e.textContent=s.trust+'%');document.querySelectorAll('[data-penalty]').forEach(e=>e.textContent='$'+s.penalty.toLocaleString());}
function shell(){meter();}
</script><script>
const moduleNodes=['Ask for prior-auth status','Declare: I am an automated AI agent for Dr. Smith','Play typing sound','Play synthetic breathing (*exhale*)','Offer NHID passport'];
const list=document.getElementById('nodes');function draw(){list.innerHTML=moduleNodes.map((nodeLabel,i)=>`<li class="metallic p-4"><button class="mr-2 text-teal-300" onclick="move(${i},-1)">↑</button><button class="mr-3 text-teal-300" onclick="move(${i},1)">↓</button><button class="mr-3 text-rose-300" onclick="removeNode(${i})">Remove</button>${nodeLabel}</li>`).join('')}function move(i,d){const j=i+d;if(j<0||j>=moduleNodes.length)return;[moduleNodes[i],moduleNodes[j]]=[moduleNodes[j],moduleNodes[i]];draw()}function removeNode(i){moduleNodes.splice(i,1);draw()}draw();check.onclick=()=>{const ok=moduleNodes[0].startsWith('Declare')&&moduleNodes[1].startsWith('Offer')&&!moduleNodes.includes('Play typing sound')&&!moduleNodes.includes('Play synthetic breathing (*exhale*)');award('module4',ok?100:65,ok?0:25000);meter();feedback.className='mt-6 rounded-3xl border p-5 '+(ok?'border-emerald-500 bg-emerald-500/10':'border-amber-500 bg-amber-500/10');feedback.innerHTML=(ok?'<b>Deployment approved.</b> But why? Logic-gated disclosure (IDG-01) comes first, the passport is offered before any data request (PDX-01), and both DBC-01 deceptive artifacts are removed.':'<b>Needs hardening.</b> But why? Disclosure must be the first logic block, and both deceptive artifacts (typing sound and synthetic breathing) must be removed — DBC-01 flags them as simulating a human, which CA AB 489 prohibits.')+'<br><a class="mt-3 inline-flex text-teal-300" href="zero-latency-dashboard.html">View dashboard →</a>';feedback.classList.remove('hidden')};
</script></body></html>
