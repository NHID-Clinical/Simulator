<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHID Knowledge Base • Zero Latency</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="nhid-knowledge-base.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  </style>
  <link rel="icon" href="assets/nhid-logo.svg" type="image/svg+xml">
</head>
<body class="bg-slate-950 text-white">
  <main class="mx-auto max-w-6xl px-6 py-10">
    <nav class="mb-8 flex items-center justify-between text-sm">
      <a href="index.html" class="inline-flex items-center gap-2 text-white/70 hover:text-teal-300"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Training home</a>
      <a href="zero-latency-dashboard.html" class="text-white/70 hover:text-teal-300">Dashboard</a>
    </nav>
    <header class="mb-8">
      <div class="text-xs font-bold uppercase tracking-[3px] text-teal-400">Runtime governance layer</div>
      <h1 class="font-display mt-3 text-5xl">NHID-Clinical Knowledge Base</h1>
      <p class="mt-3 max-w-3xl text-white/70">Scenario cards, failure modes, and if-then controls for real-world healthcare voice AI calls.</p>
    </header>
    <section id="priorities" class="grid gap-4 md:grid-cols-3"></section>
    <section class="mt-8 rounded-[2rem] border border-slate-800 bg-slate-900 p-6">
      <h2 class="font-display text-3xl">Minimal interaction record</h2>
      <div id="fields" class="mt-4 flex flex-wrap gap-2"></div>
    </section>
    <section class="mt-8">
      <h2 class="font-display text-3xl">Scenario cards</h2>
      <div id="cards" class="mt-4 grid gap-5 lg:grid-cols-3"></div>
    </section>
    <section class="mt-8 grid gap-5 lg:grid-cols-2">
      <article class="rounded-[2rem] border border-slate-800 bg-slate-900 p-6">
        <h2 class="font-display text-3xl">Failure-mode library</h2>
        <div id="failures" class="mt-4 space-y-3"></div>
      </article>
      <article class="rounded-[2rem] border border-slate-800 bg-slate-900 p-6">
        <h2 class="font-display text-3xl">If-then control rules</h2>
        <div id="rules" class="mt-4 space-y-3"></div>
      </article>
    </section>
  </main>
  <script>
    const kb = window.NHID_KB;
    document.getElementById('priorities').innerHTML = kb.priorities.map((item) => `<article class="rounded-3xl border border-teal-500/30 bg-teal-500/10 p-5"><div class="text-xs font-bold text-teal-300">Evidence ${item.strength}</div><h2 class="mt-2 font-display text-2xl">${item.title}</h2><p class="mt-2 text-sm text-white/70">${item.rule}</p></article>`).join('');
    document.getElementById('fields').innerHTML = kb.fields.map((field) => `<span class="rounded-2xl bg-white/10 px-3 py-2 text-sm">${field}</span>`).join('');
    document.getElementById('cards').innerHTML = kb.scenarioCards.map((card) => `<article class="rounded-3xl border border-slate-800 bg-slate-900 p-6"><div class="text-xs font-bold uppercase tracking-[2px] text-amber-300">${card.tier}</div><h3 class="mt-2 font-display text-2xl">${card.title}</h3><dl class="mt-4 space-y-3 text-sm text-white/70"><div><dt class="font-bold text-white">Participants</dt><dd>${card.participants}</dd></div><div><dt class="font-bold text-white">Allowed</dt><dd>${card.allowed}</dd></div><div><dt class="font-bold text-white">Blocked</dt><dd>${card.disallowed}</dd></div><div><dt class="font-bold text-white">Proof</dt><dd>${card.proof}</dd></div><div><dt class="font-bold text-white">Escalate when</dt><dd>${card.escalation}</dd></div></dl></article>`).join('');
    document.getElementById('failures').innerHTML = kb.failureModes.map((item) => `<div class="rounded-2xl bg-slate-950 p-4"><b>${item.mode}</b><p class="mt-1 text-sm text-white/70">${item.response}</p></div>`).join('');
    document.getElementById('rules').innerHTML = kb.ifThenRules.map(([ifPart, thenPart]) => `<div class="rounded-2xl bg-slate-950 p-4"><b>${ifPart}</b><p class="mt-1 text-sm text-white/70">Then ${thenPart}</p></div>`).join('');
  </script>
</body>
</html>
